name: Notify Discord on PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - closed
      - review_requested
      - ready_for_review
      - assigned
      - unassigned

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send embed to Discord
        run: |
          ACTION="${{ github.event.action }}"
          MERGED="${{ github.event.pull_request.merged }}"
          TITLE="Pull Request 이벤트가 발생했어요!"

          if [ "$ACTION" = "opened" ]; then
            TITLE="📢 새로운 Pull Request가 등록되었어요!"
          elif [ "$ACTION" = "reopened" ]; then
            TITLE="🔄 Pull Request가 다시 열렸어요!"
          elif [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            TITLE="✅ Pull Request가 머지되었어요!"
          elif [ "$ACTION" = "closed" ]; then
            TITLE="❌ Pull Request가 닫혔어요!"
          elif [ "$ACTION" = "review_requested" ]; then
            TITLE="👀 리뷰 요청이 들어왔어요!"
          elif [ "$ACTION" = "ready_for_review" ]; then
            TITLE="🚀 PR이 리뷰 준비 상태가 되었어요!"
          elif [ "$ACTION" = "assigned" ]; then
            TITLE="👤 Pull Request에 담당자가 지정되었어요!"
          elif [ "$ACTION" = "unassigned" ]; then
            TITLE="👤 Pull Request 담당자가 해제되었어요!"
          fi

          REPO_LINK="https://github.com/${{ github.repository }}"
          REPO_NAME="${{ github.repository }}"
          PR_LINK="${{ github.event.pull_request.html_url }}"

          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": 1093980,
                \"fields\": [
                  {
                    \"name\": \"Repository\",
                    \"value\": \"[$REPO_NAME]($REPO_LINK)\"
                  },
                  {
                    \"name\": \"PR Title\",
                    \"value\": \"${{ github.event.pull_request.title }}\"
                  },
                  {
                    \"name\": \"Assignees\",
                    \"value\": \"${{ join(github.event.pull_request.assignees.*.login, ', ') || '없어요' }}\"
                  },
                  {
                    \"name\": \"Reviewers\",
                    \"value\": \"${{ join(github.event.pull_request.requested_reviewers.*.login, ', ') || '없어요' }}\"
                  },
                  {
                    \"name\": \"Author\",
                    \"value\": \"${{ github.event.pull_request.user.login }}\"
                  },
                  {
                    \"name\": \"PR URL\",
                    \"value\": \"[링크]($PR_LINK)\"
                  }
                ]
              }]
            }" \
            ${{ secrets.DISCORD_PULL_REQUEST_WEBHOOK_URL }}
